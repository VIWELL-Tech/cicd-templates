name: Build & Push Docker Image to ECR(NONPROD_account)

on:
  workflow_call:
    secrets:
      VIWELL_AWS_DEV_ACCESS_KEY_ID:
        description: "AWS ACCESS KEY"
        required: true
      VIWELL_AWS_DEV_SECRET_ACCESS_KEY:
        description: "AWS SECRET KEY"
        required: true
      SLACK_WEBHOOK_URL:
        description: "slack webhook"
        required: true
      NPM_TOKEN:
        description: "Additional tag to select a runner for the job execution"
        required: false
      NPMRC_PKG:
        description: "Additional tag to select a runner for the job execution"
        required: true
      QA_DISPATCH_TOKEN:
        description: "Optional: token allowed to send a repository_dispatch to VIWELL-Tech/qa-api-automation (repo scope, or fine-grained Contents: write on that repo). When not passed, NPMRC_PKG is used."
        required: false
    inputs:
      ENVIRONMENT:
        description: "Which env this workflow will be building and deploying to"
        required: true
        type: string
      RUNS_ON:
        description: "Additional tag to select a runner for the job execution"
        required: true
        type: string
        default: "self-hosted"
      DEPLOY_NAME:
        description: "Additional tag to select a runner for the job execution"
        required: true
        type: string
      ECR_REPOSITORY:
        description: "Additional tag to select a runner for the job execution"
        required: true
        type: string



jobs:

  build:
    concurrency:
      group: build-${{ inputs.ENVIRONMENT }}-${{ inputs.DEPLOY_NAME }}
      cancel-in-progress: false
    runs-on:
      - self-hosted
      - ${{ inputs.RUNS_ON }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create .npmrc
        run: |
          echo "@viwell-tech:registry=https://npm.pkg.github.com/" > .npmrc
          echo "@VIWELL-Tech:registry=https://npm.pkg.github.com/" >> .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.NPMRC_PKG }}" >> .npmrc


      - name: Create .yarnrc.yml
        run: |
          cat <<EOF > .yarnrc.yml
          npmRegistryServer: "https://registry.npmjs.org"
          npmScopes:
            viwell-tech:
              npmRegistryServer: "https://npm.pkg.github.com"
              npmAuthToken: "${{ secrets.NPMRC_PKG }}"
            VIWELL-Tech:
              npmRegistryServer: "https://npm.pkg.github.com"
              npmAuthToken: "${{ secrets.NPMRC_PKG }}"
          
          npmRegistries:
            "https://npm.pkg.github.com":
              npmAuthToken: "${{ secrets.NPMRC_PKG }}"
          EOF



      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.VIWELL_AWS_DEV_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.VIWELL_AWS_DEV_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Create Docker image tag
        id: vars
        run: echo "TAG=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ENV: ${{ inputs.ENVIRONMENT }}
          ECR_REPOSITORY: ${{ inputs.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "${{ vars.ENV_DEV }}" > .env
          TAG=${{ steps.vars.outputs.TAG }}
          docker build . -t $ECR_REGISTRY/$ENV/viwell-$ECR_REPOSITORY:$TAG
          docker tag $ECR_REGISTRY/$ENV/viwell-$ECR_REPOSITORY:$TAG $ECR_REGISTRY/$ENV/viwell-$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ENV/viwell-$ECR_REPOSITORY:$TAG
          docker push $ECR_REGISTRY/$ENV/viwell-$ECR_REPOSITORY:latest
          echo "tag=$TAG" >> $GITHUB_ENV
      - name: Post a message in a channel
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "*GitHub Action build result in ${{ inputs.ENVIRONMENT }} for ${{ inputs.DEPLOY_NAME }}*: ${{ job.status }}\n${{ github.event.pull_request.html_url || github.event.head_commit.url }}"
            blocks:
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "GitHub Action build result in ${{ inputs.ENVIRONMENT }} for ${{ inputs.DEPLOY_NAME }}*: ${{ job.status }}\n${{ github.event.pull_request.html_url || github.event.head_commit.url }}"


  deploy:
    needs: build
    concurrency:
      group: deploy-${{ inputs.ENVIRONMENT }}-${{ inputs.DEPLOY_NAME }}
      cancel-in-progress: false
    runs-on:
      - self-hosted
      - ${{ inputs.RUNS_ON }}
    steps:
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'
      - name: Configure EKS
        env:
          ENVIRONMENT: ${{ inputs.ENVIRONMENT }}
          DEPLOY_NAME: ${{ inputs.DEPLOY_NAME }}
        run: |
          if [ "$ENVIRONMENT" = "staging" ]; then
            kubectl rollout restart deployment "$DEPLOY_NAME" --namespace=viwell-preprod
            echo "Deployment restarted in Staging env"
          elif [ "$ENVIRONMENT" = "prod" ]; then
            kubectl rollout restart deployment "$DEPLOY_NAME" --namespace=prod-viwell
            echo "Deployment restarted in Prod env"
          else
            echo "::error::Unknown environment '$ENVIRONMENT'"
            exit 1
          fi

      - name: Post a message in a channel
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "*GitHub Action deployment result in ${{ inputs.ENVIRONMENT }} for ${{ inputs.DEPLOY_NAME }} *: ${{ job.status }}\n${{ github.event.pull_request.html_url || github.event.head_commit.url }}"
            blocks:
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "GitHub Action deployment result in ${{ inputs.ENVIRONMENT }} for ${{ inputs.DEPLOY_NAME }}: ${{ job.status }}\n${{ github.event.pull_request.html_url || github.event.head_commit.url }}"

  migrate_db:
    needs: deploy
    concurrency:
      group: migrate-db-${{ inputs.ENVIRONMENT }}-${{ inputs.DEPLOY_NAME }}
      cancel-in-progress: false
    runs-on:
      - self-hosted
      - ${{ inputs.RUNS_ON }}
    steps:
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'
      - name: Configure EKS
        run: |
          if [ "${{ inputs.ENVIRONMENT }}" = "staging" ]; then
            K8S_NAMESPACE="viwell-preprod"
          elif [ "${{ inputs.ENVIRONMENT }}" = "prod" ]; then
            K8S_NAMESPACE="prod-viwell"
          else
            echo "::error::Unknown environment '${{ inputs.ENVIRONMENT }}'"
            exit 1
          fi 
          if kubectl -n "$K8S_NAMESPACE" exec -i deploy/"${{ inputs.DEPLOY_NAME }}" -- grep -q migrate-js:run:all package.json; then
            kubectl -n "$K8S_NAMESPACE" rollout status deployment "${{ inputs.DEPLOY_NAME }}" --timeout=10m
            echo "Migrating..."
            kubectl -n "$K8S_NAMESPACE" exec -i deploy/"${{ inputs.DEPLOY_NAME }}" -- yarn migrate-js:run:all
            echo "============================="
            echo "✅ No migration errors."
            echo "============================="
          else
              echo "::notice::$DEPLOY_NAME has no migrate-js:run:all script; skipping migrations"
          fi

  # After a successful STAGING deploy, start the QA core regression run (about 2,300 API tests,
  # ~20 min) in VIWELL-Tech/qa-api-automation: .github/workflows/core-regression.yml listens for
  # repository_dispatch "backend-deployed" and reports to Slack only when something is wrong.
  # Never fails a deploy: every step is best-effort.
  notify_qa:
    name: Start the QA core regression run
    needs: [deploy, migrate_db]
    if: ${{ inputs.ENVIRONMENT == 'staging' }}
    continue-on-error: true
    runs-on:
      - self-hosted
      - ${{ inputs.RUNS_ON }}
    steps:
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      # The deploy job only restarts the deployment; test the new pods, not the old ones.
      - name: Wait for the new pods to be ready
        env:
          DEPLOY_NAME: ${{ inputs.DEPLOY_NAME }}
        run: kubectl -n viwell-preprod rollout status deployment "$DEPLOY_NAME" --timeout=10m || echo "::warning::rollout status did not confirm in 10 min; notifying QA anyway"

      - name: Send backend-deployed to qa-api-automation
        env:
          TOKEN: ${{ secrets.QA_DISPATCH_TOKEN || secrets.NPMRC_PKG }}
          SERVICE: ${{ inputs.DEPLOY_NAME }}
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::no token available: the QA core regression run was not started"
            exit 0
          fi
          payload=$(printf '{"event_type":"backend-deployed","client_payload":{"service":"%s","repository":"%s","sha":"%s","run_url":"%s"}}' \
            "$SERVICE" "$SOURCE_REPO" "$SOURCE_SHA" "$RUN_URL")
          code=$(curl -s -o /tmp/qa-dispatch.out -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/VIWELL-Tech/qa-api-automation/dispatches \
            -d "$payload")
          if [ "$code" = "204" ]; then
            echo "QA core regression run requested for $SERVICE: https://github.com/VIWELL-Tech/qa-api-automation/actions/workflows/core-regression.yml"
          else
            echo "::warning::qa-api-automation dispatch answered HTTP $code: $(head -c 300 /tmp/qa-dispatch.out)"
          fi
